name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      component-output-key: clients/typescript
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  trigger-docker-publish:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      actions: write
    steps:
      - name: Publish the released tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_TOKEN_AVAILABLE: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$RELEASE_TOKEN_AVAILABLE" = true ]; then
            echo 'The release token starts Docker publication automatically.'
          else
            gh workflow run docker-publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          fi

  publish-typescript-client:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ needs.release-please.outputs.component_release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.component_tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@matt-riley'
      - name: Install dependencies
        run: npm ci
        working-directory: clients/typescript
      - name: Build
        run: npm run build
        working-directory: clients/typescript
      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: clients/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
