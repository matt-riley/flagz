name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@7fd3aefaab1ae14d063930c85b2d629280c36620 # v2
    with:
      go-version-file: go.mod
      run-race: true
      run-vet: true
      concurrency-suffix: test

  test-go-client:
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@7fd3aefaab1ae14d063930c85b2d629280c36620 # v2
    with:
      go-version-file: go.mod
      working-directory: clients/go
      run-vet: true
      concurrency-suffix: test-go-client
