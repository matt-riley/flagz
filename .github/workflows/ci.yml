name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
    with:
      run-vet: false
      run-test: true

  test-go-client:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test-go-client
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
    with:
      run-vet: false
      run-test: true
      working-directory: clients/go
      build-command: go mod tidy
