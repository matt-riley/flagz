name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@cb986078a5bd4775e5fb05348f3618e41fedf4de # v4
    with:
      run-vet: false
      run-test: true

  test-go-client:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test-go-client
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@cb986078a5bd4775e5fb05348f3618e41fedf4de # v4
    with:
      run-vet: false
      run-test: true
      working-directory: clients/go
