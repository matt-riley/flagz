name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@c956b4c8237a0b1d733735d48a3724edde629717 # v4
    with:
      run-vet: false
      run-test: true

  test-go-client:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:test-go-client
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/go-ci.yml@c956b4c8237a0b1d733735d48a3724edde629717 # v4
    with:
      run-vet: false
      run-test: true
      working-directory: clients/go
      build-command: go mod tidy
