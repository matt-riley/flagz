name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@bcaf4ae43edf7d26421741424b82c842c83e55ce # v2
    with:
      install: true
      test: true
      concurrency-suffix: test

  test-go-client:
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@bcaf4ae43edf7d26421741424b82c842c83e55ce # v2
    with:
      install: true
      test: true
      working-directory: clients/go
      concurrency-suffix: test-go-client
