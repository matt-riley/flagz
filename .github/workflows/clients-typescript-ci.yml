name: TypeScript Client CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:build-and-test
      cancel-in-progress: true
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@cb986078a5bd4775e5fb05348f3618e41fedf4de # v4
    with:
      install: true
      working-directory: clients/typescript
      lint: false
      test: true
      build: true

  verify-proto-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Verify proto sync
        run: |
          # The TS client proto is a copy of the canonical api/proto/v1/flag_service.proto.
          # This check ensures they stay in sync.
          diff api/proto/v1/flag_service.proto clients/typescript/proto/flag_service.proto
