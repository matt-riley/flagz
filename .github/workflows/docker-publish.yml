name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    permissions:
      contents: read
      packages: write
    uses: matt-riley/matt-riley-ci/.github/workflows/docker-ghcr-publish.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
    with:
      tag-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
