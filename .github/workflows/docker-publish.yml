name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-publish:
    permissions:
      contents: read
      packages: write
    uses: matt-riley/matt-riley-ci/.github/workflows/docker-ghcr-publish.yml@b65e4f9b6883ebb8735e5f5e61f46d226024b76d # v4
    with:
      tag-name: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
